name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pixel-strike-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Test and build
        shell: bash
        run: |
          set -euo pipefail
          npm run build --prefix client &
          client_pid=$!
          (cd server && go test ./...) &
          server_pid=$!
          wait "$client_pid"
          wait "$server_pid"

      - name: Package production source
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          git archive --format=tar.gz -o release/source.tar.gz HEAD
          cp deploy/remote.sh release/

      - name: Upload production release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-${{ github.sha }}
          path: release/
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: production-${{ github.sha }}
          path: release

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/pixel-strike
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/pixel-strike ~/.ssh/known_hosts

      - name: Deploy and verify
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PROXY_PATH: ${{ secrets.DEPLOY_PROXY_PATH }}
          DEPLOY_OPENRESTY: ${{ secrets.DEPLOY_OPENRESTY }}
          DEPLOY_ORIGIN_HOST: ${{ secrets.DEPLOY_ORIGIN_HOST }}
        run: |
          set -euo pipefail
          remote_root="/tmp/pixel-strike-releases"
          remote_release="$remote_root/${GITHUB_SHA}"
          ssh_args=(-i ~/.ssh/pixel-strike -o IdentitiesOnly=yes -p "$DEPLOY_PORT")
          scp_args=(-i ~/.ssh/pixel-strike -o IdentitiesOnly=yes -P "$DEPLOY_PORT")
          ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "rm -rf '$remote_root' && mkdir -p '$remote_release'"
          scp "${scp_args[@]}" release/* "$DEPLOY_USER@$DEPLOY_HOST:$remote_release/"
          ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "sh '$remote_release/remote.sh' '$remote_release' '$DEPLOY_PATH' '$DEPLOY_PROXY_PATH' '$DEPLOY_OPENRESTY' '$DEPLOY_ORIGIN_HOST'"
